# Mini-Prop OS configuration — futures (Micro E-mini S&P 500).
# Every key is validated at startup (mini_prop_os/core/config.py); unknown
# keys and out-of-range values abort before any connection is attempted.

connection:
  host: 127.0.0.1
  port: 7497          # 7497 = TWS paper, 4002 = IB Gateway paper.
                      # 7496 / 4001 are LIVE — set deliberately, never by default.
  client_id: 17
  account: ""         # empty = first managed account
  connect_timeout_s: 15.0
  heartbeat_interval_s: 10.0
  heartbeat_timeout_s: 5.0
  heartbeat_max_misses: 3
  reconnect_backoff_base_s: 2.0
  reconnect_backoff_max_s: 120.0
  reconnect_max_attempts: 0   # 0 = retry forever

contract:
  symbol: MES         # Micro E-mini S&P 500 (use ES only if sized for it)
  sec_type: FUT
  exchange: CME
  currency: USD
  multiplier: 5.0     # MES=$5/point (ES=50, MNQ=2, NQ=20). Verified against
                      # the venue at connect time; mismatch refuses to trade.
  last_trade_date: "" # empty = auto-resolve current front month at connect

strategy:
  name: adaptive_ema  # volatility-adaptive; "ema_crossover" = plain baseline
  bar_size: "1 min"
  fast_period: 9
  slow_period: 21
  order_quantity: 2   # base contracts (LOW/NORMAL vol); HIGH halves, EXTREME 0
  warmup_bars: 0      # 0 = derived by the strategy
  use_rth: false      # futures trade nearly 24h; true only for stocks
  vol_fast_period: 10     # EWMA window for current volatility
  vol_slow_period: 100    # EWMA window for the long-run baseline
  high_vol_ratio: 1.6     # fast/slow vol ratio: HIGH regime above this
  extreme_vol_ratio: 2.5  # EXTREME above this -> risk-off (exit, no entries)
  confirm_window: 10      # bars a golden cross has to confirm before expiry
  learn: true             # bounded per-regime entry-threshold adaptation

risk:
  max_position_shares: 4        # max |contracts| per symbol
  max_position_notional: 150000.0   # |contracts| * price * multiplier
  max_order_quantity: 2         # contracts per order
  max_gross_notional: 300000.0
  max_daily_loss: 1000.0        # currency; effective limit is the tighter of
  max_daily_loss_pct: 0.02      # this and pct * start-of-day equity
  allow_short: false
  kill_switch_flattens: true    # breach -> cancel all + flatten book

execution:
  execution_log_path: state/executions.jsonl
  order_timeout_s: 60.0
  cancel_on_shutdown: true
  flatten_on_shutdown: false

logging:
  level: INFO
  file: state/mini_prop_os.log
