[project]
name = "ftmo-bot"
version = "0.1.0"
description = "Rules-first FTMO challenge bot: Asian-range breakout inside a drawdown engine that cannot be overridden"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# MetaTrader5 is Windows-only; install on the VPS with `uv sync --extra live`.
live = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[project.scripts]
ftmo-bot = "ftmo_bot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.1",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftmo_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["ftmo_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/ftmo_bot/backtest/report.py" = ["E501"]  # inline HTML/CSS template

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["ftmo_bot"]

[[tool.mypy.overrides]]
module = ["MetaTrader5", "MetaTrader5.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
