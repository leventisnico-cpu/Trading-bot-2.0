# Operator waivers for the expectancy gate.
#
# The gate (scripts/expectancy.py) decides whether a strategy has EARNED a
# live port. A strategy that fails it may still run live, but only if the
# operator signs a waiver here for that exact strategy and symbol. A waiver
# does not change the gate's verdict or the module's DEPLOYABLE marker; it
# records that the operator read the failing numbers and chose to accept
# them. main.py checks this file before it will connect to a live port.
#
# A waiver counts only if every field below is filled in, signed_on is a
# real YYYY-MM-DD date, and strategy + symbol match the running config.
# The assistant never signs a waiver; the operator writes signed_by and
# signed_on.
#
# A waiver clears the gate only. The other rails still apply: the TFSA
# trades stocks/ETFs only, and a live port in a config file is still the
# operator's separate go-live order (docs/LIVE_READINESS.md).
#
# Template (copy into the list below, fill every field, commit):
#
#  - strategy: air3_trend
#    symbol: SMH
#    gate_report: reports/minipropos_expectancy_smh.md
#    gate_result: "passes 1/3 folds, full sample no (gain/DD 3.71 vs 3.72)"
#    accepted_risk: >-
#      Keeps about half of buy-and-hold's gain over 2007-2026 and less than
#      half in 2013-2020 and 2020-2026, in exchange for a max drawdown of
#      about 30% instead of 61%.
#    signed_by: ""
#    signed_on: ""

waivers: []
